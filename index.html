<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 학급 고정 QR 관리자</title>
    <!-- QR코드 자동 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.8rem; color: #333; margin-bottom: 20px; }
        .status-box { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; word-break: break-all; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background-color: #007BFF; color: white; border: none; border-radius: 5px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
        #qrcode-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
        #qrcode { margin: 15px 0; padding: 10px; background: white; border: 2px solid #ddd; border-radius: 10px; }
        .guide { font-size: 0.9rem; color: #666; margin-top: 10px; text-align: left; line-height: 1.5; background: #fff8e1; padding: 15px; border-radius: 5px; }
        #loading { font-size: 2rem; font-weight: bold; margin-top: 100px; }
    </style>
</head>
<body>

    <!-- 리다이렉트(학생 이동) 중일 때 띄울 화면 -->
    <div id="loading-screen" style="display: none;">
        <div id="loading">🚀 설정된 주소로 이동 중입니다...</div>
    </div>

    <!-- 교사 관리자 화면 -->
    <div id="admin-screen" class="container" style="display: none;">
        <h1>스마트 학급 고정 QR 관리자</h1>
        
        <div class="status-box">
            현재 연결된 주소:<br>
            <span id="current-url" style="color: #007BFF;">불러오는 중...</span>
        </div>

        <input type="text" id="new-url" placeholder="여기에 새 이동 주소(URL)를 입력하세요 (http:// 포함)">
        <button id="saveBtn">이 주소로 변경하기</button>

        <div id="qrcode-container">
            <h3>📌 교실 부착용 고정 QR코드</h3>
            <div id="qrcode"></div>
            <p style="font-size: 0.85rem; color: #888;">위 QR코드를 캡처해서 칠판이나 게시판에 인쇄해 두세요.</p>
        </div>

        <div class="guide">
            <strong>사용 방법</strong><br>
            1. 이 사이트 주소는 교사(본인)만 알고 즐겨찾기 해두세요.<br>
            2. 애들에게 안내할 주소(구글폼, 띵커벨 등)가 생기면 위 입력창에 넣고 변경을 누릅니다.<br>
            3. 학생들은 항상 똑같은 QR코드를 찍지만, 클릭하는 순간 교사가 방금 설정한 최신 주소로 자동 이동합니다.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // ★★★ 파이어베이스 설정 덮어쓰기 ★★★
        // 아까 만들어둔 파이어베이스 프로젝트의 Config를 여기에 똑같이 붙여넣어라.
        const firebaseConfig = {
              apiKey: "AIzaSyDMQJnSwF09W-qKcHGFqzr3fNoQSQN-cq8",
              authDomain: "seat-f3944.firebaseapp.com",
              projectId: "seat-f3944",
              storageBucket: "seat-f3944.firebasestorage.app",
              messagingSenderId: "288606604988",
              appId: "1:288606604988:web:4a9d7697a58bca7e814ab9",
              measurementId: "G-ZQV1DV07D7"
        };
        // ★★★ 여기까지 ★★★

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "qrData", "redirectUrl");

        // 현재 URL의 파라미터 확인 (학생들이 QR 찍고 들어왔는지 감지)
        const urlParams = new URLSearchParams(window.location.search);
        const isRedirectMode = urlParams.has('go');

        if (isRedirectMode) {
            // [학생 모드] QR 찍고 들어온 경우: 화면 숨기고 DB에서 주소 가져와서 강제 이동
            document.getElementById('loading-screen').style.display = 'block';
            getDoc(docRef).then((docSnap) => {
                if (docSnap.exists() && docSnap.data().url) {
                    window.location.href = docSnap.data().url; // 0.1초만에 강제 리다이렉트
                } else {
                    document.getElementById('loading').innerText = "⚠️ 현재 설정된 주소가 없습니다.";
                }
            }).catch((e) => {
                document.getElementById('loading').innerText = "접속 에러 발생. 교사에게 문의하세요.";
            });

        } else {
            // [교사 관리자 모드] 그냥 주소 치고 들어온 경우: 관리자 UI 표시
            document.getElementById('admin-screen').style.display = 'block';
            
            // 학생용 고정 주소 생성 (현재 주소 뒤에 ?go=true 를 붙임)
            const studentUrl = window.location.origin + window.location.pathname + "?go=true";
            
            // QR코드 자동 생성
            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // 현재 DB에 저장된 주소 불러오기
            getDoc(docRef).then((docSnap) => {
                if (docSnap.exists() && docSnap.data().url) {
                    document.getElementById('current-url').innerText = docSnap.data().url;
                } else {
                    document.getElementById('current-url').innerText = "등록된 주소 없음";
                }
            });

            // 새 주소 DB에 저장하기
            document.getElementById('saveBtn').addEventListener('click', async () => {
                const newUrl = document.getElementById('new-url').value.trim();
                if (!newUrl.startsWith("http")) {
                    alert("주소는 반드시 http:// 나 https:// 로 시작해야 한다.");
                    return;
                }
                
                document.getElementById('saveBtn').innerText = "저장 중...";
                try {
                    await setDoc(docRef, { url: newUrl });
                    document.getElementById('current-url').innerText = newUrl;
                    document.getElementById('new-url').value = '';
                    alert("주소 변경 완료! 이제 학생들이 QR을 찍으면 방금 설정한 곳으로 이동한다.");
                } catch (e) {
                    alert("DB 저장 실패. 파이어베이스 보안 규칙(Test Mode) 세팅을 확인해라.");
                } finally {
                    document.getElementById('saveBtn').innerText = "이 주소로 변경하기";
                }
            });
        }
    </script>
</body>
</html>
